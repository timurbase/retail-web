# Explicit Node toolchain for Railway. Default Node 18 was removed from
# nixpkgs (EOL); pin a current LTS so the build doesn't trip on upstream
# package retirements.

[phases.setup]
nixPkgs = ["nodejs_22", "bun"]

[phases.install]
cmds = ["bun install --frozen-lockfile"]

[phases.build]
cmds = ["bun run build"]

[start]
cmd = "bun run start"

[variables]
NODE_ENV = "production"
