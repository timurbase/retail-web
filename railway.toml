# Railway build + deploy config for RetailFlow web (Next.js 16).
#
# Required env vars (set in Railway dashboard):
#   NEXT_PUBLIC_API_BASE_URL  -> e.g. https://retail-backend-production.up.railway.app
#   NODE_ENV=production       (auto)
#
# Optional:
#   PORT                      (Railway sets it)

[build]
builder = "nixpacks"

[deploy]
startCommand = "bun start -p $PORT"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
